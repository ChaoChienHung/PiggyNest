<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/piggynest.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fff8fa" />
    <meta name="description" content="Track your money across PiggyBanks with PiggyNest." />
    <title>PiggyNest</title>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('piggynest-theme');
          if (saved === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#1b141e');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
